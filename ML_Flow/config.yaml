# Configuration for DVC & MLflow Pipeline

data:
  output_path: "data/train.csv"
  n_samples: 1000
  n_features: 10
  random_state: 42

train:
  experiment_name: "DVC_MLflow_Pipeline"
  runs:
    - run_name: "Run_1_Baseline"
      n_estimators: 30
      max_depth: 2
    - run_name: "Run_2_Tuned"
      n_estimators: 100
      max_depth: 5
